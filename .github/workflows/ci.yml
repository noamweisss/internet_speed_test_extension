# CI is the Windows compiler for agents working in Linux containers (docs/TESTING.md).
# Independent jobs so a failure points at one layer: rules, Core tests, extension build, safety impact.
# Actions are pinned to full commit SHAs (tag in the comment) so a retargeted tag cannot change what runs.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    name: Project rules (scripts/check.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash scripts/check.sh all

  core-tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/SpeedTest.Core.Tests -c Release
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1

  extension-build:
    name: Extension build (Windows, x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build internet_speed_test_extension/internet_speed_test_extension.csproj -c Release -p:Platform=x64
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1

  safety-impact:
    name: Safety impact declared (docs/SAFETY-CONTRACT.md)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/safety-impact.sh "origin/${{ github.base_ref }}" HEAD
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
